name: Build Pinky VPN APK

# Builds a pastel-pink themed v2rayNG (open source, GPL-3.0) into an installable APK.
# Run it from the "Actions" tab -> "Build Pinky VPN APK" -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Get v2rayNG source (pinned version)
        run: |
          git clone https://github.com/2dust/v2rayNG.git src
          cd src
          git checkout e1b73f2fa8487dfc303da52d1097c9c1e3238b64
          git submodule update --init --recursive
          # برای اینکه git describe --tags کار کنه
          cd AndroidLibXrayLite
          git fetch --tags --force

      - name: Write pink theme files
        run: |
          mkdir -p pink/overlay/java/com/v2ray/ang/ui/compose
          cat > pink/apply.py <<'PINK_APPLY_EOF'
          #!/usr/bin/env python3
          """Applies the Pinky VPN pastel-pink theme on top of a checkout of 2dust/v2rayNG.
          Usage: python3 apply.py <path-to-v2rayNG-checkout>
          Every edit is asserted, so the build fails loudly instead of silently producing an unthemed app."""
          import pathlib, re, shutil, sys

          root = pathlib.Path(sys.argv[1]).resolve()
          here = pathlib.Path(__file__).resolve().parent
          app = root / "V2rayNG" / "app"
          main = app / "src" / "main"
          kt = main / "java" / "com" / "v2ray" / "ang"


          def read(p):
              return p.read_text(encoding="utf-8")


          def sub_once(path, old, new, regex=False):
              s = read(path)
              if regex:
                  s2, n = re.subn(old, new, s, count=1, flags=re.S)
              else:
                  n = s.count(old)
                  s2 = s.replace(old, new, 1)
              assert n >= 1, f"pattern not found in {path}: {old[:60]!r}"
              path.write_text(s2, encoding="utf-8")


          def sub_all(path, old, new, expect_min=1):
              s = read(path)
              n = s.count(old)
              assert n >= expect_min, f"pattern not found in {path}: {old!r}"
              path.write_text(s.replace(old, new), encoding="utf-8")


          # ---------------------------------------------------------------- colors
          theme = kt / "ui" / "compose" / "Theme.kt"
          new_colors = '''private val LightColor = lightColorScheme(
              primary = Color(0xFFFF5C9E),
              onPrimary = Color(0xFFFFFFFF),
              primaryContainer = Color(0xFFFFD6E8),
              onPrimaryContainer = Color(0xFF5A1F3F),
              secondary = Color(0xFFEC5F9C),
              onSecondary = Color(0xFFFFFFFF),
              secondaryContainer = Color(0xFFFFE0EE),
              onSecondaryContainer = Color(0xFF4A1230),
              tertiary = Color(0xFF45C79A),
              onTertiary = Color(0xFFFFFFFF),
              tertiaryContainer = Color(0xFFC9F5E2),
              onTertiaryContainer = Color(0xFF00382A),
              error = Color(0xFFD6336C),
              errorContainer = Color(0xFFFFDAD6),
              onError = Color(0xFFFFFFFF),
              onErrorContainer = Color(0xFF410002),
              background = Color(0xFFFFF4F8),
              onBackground = Color(0xFF4A2339),
              surface = Color(0xFFFFF8FA),
              onSurface = Color(0xFF4A2339),
              surfaceVariant = Color(0xFFFBE3EE),
              onSurfaceVariant = Color(0xFF7A4A63),
              outline = Color(0xFFC48AA7),
              outlineVariant = Color(0xFFF3CFE0),
              inverseSurface = Color(0xFF4A2339),
              inverseOnSurface = Color(0xFFFFEEF5),
              inversePrimary = Color(0xFFFFA3C8),
              scrim = Color(0xFF000000),
              surfaceTint = Color(0xFFFF5C9E),
              surfaceContainerLowest = Color(0xFFFFFFFF),
              surfaceContainerLow = Color(0xFFFFF0F6),
              surfaceContainer = Color(0xFFFFE9F2),
              surfaceContainerHigh = Color(0xFFFFE0EC),
              surfaceContainerHighest = Color(0xFFFFD6E6),
          )

          private val DarkColor = darkColorScheme(
              primary = Color(0xFFFFA3C8),
              onPrimary = Color(0xFF5A0F36),
              primaryContainer = Color(0xFF7A2C55),
              onPrimaryContainer = Color(0xFFFFD9E8),
              secondary = Color(0xFFFF8FBC),
              onSecondary = Color(0xFF4A1230),
              secondaryContainer = Color(0xFF6B2B4E),
              onSecondaryContainer = Color(0xFFFFE0EE),
              tertiary = Color(0xFF83D6B5),
              onTertiary = Color(0xFF00382E),
              tertiaryContainer = Color(0xFF005143),
              onTertiaryContainer = Color(0xFFA0F2D0),
              error = Color(0xFFFFB4AB),
              errorContainer = Color(0xFF93000A),
              onError = Color(0xFF690005),
              onErrorContainer = Color(0xFFFFDAD6),
              background = Color(0xFF24141D),
              onBackground = Color(0xFFF5DCE8),
              surface = Color(0xFF24141D),
              onSurface = Color(0xFFF5DCE8),
              surfaceVariant = Color(0xFF4A3441),
              onSurfaceVariant = Color(0xFFE5C7D6),
              outline = Color(0xFFB08A9C),
              outlineVariant = Color(0xFF4A3441),
              inverseSurface = Color(0xFFF5DCE8),
              inverseOnSurface = Color(0xFF24141D),
              inversePrimary = Color(0xFFFF5C9E),
              scrim = Color(0xFF000000),
              surfaceTint = Color(0xFFFFA3C8),
              surfaceContainerLowest = Color(0xFF1B0F16),
              surfaceContainerLow = Color(0xFF2B1A24),
              surfaceContainer = Color(0xFF33202B),
              surfaceContainerHigh = Color(0xFF3D2733),
              surfaceContainerHighest = Color(0xFF48303C),
          )

          // Semantic Colors
          val colorPing = Color(0xFF45C79A) // Mint
          val colorPingRed = Color(0xFFFF6B8B) // Rose
          val colorConfigType = Color(0xFFEC5F9C) // Pink
          val colorFabActive = Color(0xFFFF5C9E) // Deep pink
          val colorFabInactiveLight = Color(0xFFFFA9CC) // Soft pink
          val colorFabInactiveDark = Color(0xFF8A5A74) // Dusty plum
          val dividerColorLight = Color(0xFFF3CFE0) // Pale pink
          val dividerColorDark = Color(0xFF4D3442) // Plum

          '''
          sub_once(theme, r"private val LightColor = .*?(?=// Toast Colors)", new_colors.replace("\\", "\\\\"), regex=True)
          # the pastel palette should show up by default (not the phone's wallpaper colours)
          sub_all(theme, "PREF_DYNAMIC_COLOR, true", "PREF_DYNAMIC_COLOR, false", 2)
          sub_all(kt / "ui" / "settings" / "SettingsActivity.kt", "PREF_DYNAMIC_COLOR, true", "PREF_DYNAMIC_COLOR, false")
          # floating bubbles on top of every screen (non-interactive)
          sub_once(
              theme,
              "                content()\n                AppSnackbarHost(",
              "                content()\n                PinkBubbles()\n                AppSnackbarHost(",
          )

          # ------------------------------------------------------------ connect button
          bar = kt / "ui" / "main" / "MainBottomBar.kt"
          sub_once(
              bar,
              "import androidx.compose.animation.core.Animatable\n",
              "import androidx.compose.animation.core.Animatable\n"
              "import androidx.compose.animation.core.RepeatMode\n"
              "import androidx.compose.animation.core.animateFloat\n"
              "import androidx.compose.animation.core.infiniteRepeatable\n"
              "import androidx.compose.animation.core.rememberInfiniteTransition\n"
              "import androidx.compose.runtime.getValue\n",
          )
          sub_once(
              bar,
              "    val rotationAnim = remember { Animatable(0f) }\n",
              "    val rotationAnim = remember { Animatable(0f) }\n"
              "    val pinkTransition = rememberInfiniteTransition(label = \"pinkPulse\")\n"
              "    val pinkPulse by pinkTransition.animateFloat(\n"
              "        initialValue = 1f,\n"
              "        targetValue = 1.14f,\n"
              "        animationSpec = infiniteRepeatable(tween(durationMillis = 900), RepeatMode.Reverse),\n"
              "        label = \"pinkPulseValue\"\n"
              "    )\n",
          )
          sub_once(
              bar,
              "                .offset(y = (-28).dp)\n                .navigationBarsPadding(),",
              "                .offset(y = (-28).dp)\n                .navigationBarsPadding()\n"
              "                .graphicsLayer {\n"
              "                    val s = if (isRunning) pinkPulse else 1f\n"
              "                    scaleX = s\n"
              "                    scaleY = s\n"
              "                },",
          )

          # ------------------------------------------------------------- name / package
          res = main / "res"
          for f in res.glob("values*/strings.xml"):
              s = read(f)
              s2 = re.sub(r'(<string name="app_name"[^>]*>)v2rayNG(</string>)', r"\1Pinky VPN\2", s)
              f.write_text(s2, encoding="utf-8")
          assert ">Pinky VPN<" in read(res / "values" / "strings.xml"), "app_name not replaced"

          gradle = app / "build.gradle.kts"
          sub_once(gradle, 'applicationId = "com.v2ray.ang"', 'applicationId = "com.v2ray.ang.pinky"')
          sub_all(gradle, "v2rayNG_", "PinkyVPN_")
          sub_all(main / "res" / "xml" / "shortcuts.xml", 'android:targetPackage="com.v2ray.ang"',
                  'android:targetPackage="com.v2ray.ang.pinky"', 4)

          # ----------------------------------------------------------- window colors
          themes = res / "values" / "themes.xml"
          sub_once(themes, '<color name="window_background_light">#FFFFFFFF</color>',
                   '<color name="window_background_light">#FFFFF4F8</color>')
          sub_once(themes, '<color name="window_background_dark">#FF1C1B1F</color>',
                   '<color name="window_background_dark">#FF24141D</color>')
          (res / "values" / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="ic_launcher_background">#FF8FBC</color>\n</resources>\n', encoding="utf-8")
          (res / "values" / "ic_banner_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="ic_launcher_background">#FF8FBC</color>\n</resources>\n', encoding="utf-8")

          # ------------------------------------------------- new files / icon overlay
          overlay = here / "overlay"
          for src in overlay.rglob("*"):
              if src.is_file():
                  dst = app / "src" / "main" / src.relative_to(overlay)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src, dst)
                  print("overlay:", dst.relative_to(root))

          print("Pinky theme applied OK")
          PINK_APPLY_EOF
          cat > pink/genicons.py <<'PINK_ICONS_EOF'
          import math, pathlib
          from PIL import Image, ImageDraw, ImageFilter

          import sys
          OUT = pathlib.Path(sys.argv[1])
          SS = 4  # supersampling

          def heart_poly(cx, cy, size, n=240):
              pts = []
              for i in range(n):
                  t = 2 * math.pi * i / n
                  x = 16 * math.sin(t) ** 3
                  y = 13 * math.cos(t) - 5 * math.cos(2 * t) - 2 * math.cos(3 * t) - math.cos(4 * t)
                  pts.append((cx + x * size / 34, cy - y * size / 34))
              return pts

          def gradient(size, c1, c2):
              g = Image.new("RGBA", (size, size))
              px = g.load()
              for y in range(size):
                  for x in range(size):
                      t = (x + y) / (2 * size)
                      px[x, y] = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3)) + (255,)
              return g

          def heart_layer(size, scale, shadow=True):
              big = size * SS
              layer = Image.new("RGBA", (big, big), (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)
              d.polygon(heart_poly(big / 2, big / 2 + big * 0.02, big * scale), fill=(255, 255, 255, 255))
              # little sparkle
              sx, sy, r = big * 0.70, big * 0.30, big * 0.045
              d.polygon([(sx, sy - r * 2), (sx + r * 0.6, sy - r * 0.6), (sx + r * 2, sy), (sx + r * 0.6, sy + r * 0.6),
                         (sx, sy + r * 2), (sx - r * 0.6, sy + r * 0.6), (sx - r * 2, sy), (sx - r * 0.6, sy - r * 0.6)],
                        fill=(255, 255, 255, 235))
              if shadow:
                  sh = Image.new("RGBA", (big, big), (0, 0, 0, 0))
                  sd = ImageDraw.Draw(sh)
                  sd.polygon(heart_poly(big / 2, big / 2 + big * 0.045, big * scale), fill=(214, 51, 108, 90))
                  sh = sh.filter(ImageFilter.GaussianBlur(big * 0.02))
                  sh.alpha_composite(layer)
                  layer = sh
              return layer.resize((size, size), Image.LANCZOS)

          def save(img, rel):
              p = OUT / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              img.save(p)

          C1, C2 = (255, 182, 211), (255, 112, 168)

          # adaptive foreground (safe zone = inner 66%)
          for d, s in {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}.items():
              save(heart_layer(s, 0.50), f"mipmap-{d}/ic_launcher_foreground.png")

          # legacy icons
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              bg = gradient(s * SS, C1, C2)
              mask = Image.new("L", (s * SS, s * SS), 0)
              ImageDraw.Draw(mask).rounded_rectangle([0, 0, s * SS - 1, s * SS - 1], radius=int(s * SS * 0.24), fill=255)
              sq = Image.new("RGBA", (s * SS, s * SS), (0, 0, 0, 0)); sq.paste(bg, (0, 0), mask)
              sq = sq.resize((s, s), Image.LANCZOS)
              sq.alpha_composite(heart_layer(s, 0.62))
              save(sq, f"mipmap-{d}/ic_launcher.png")
              if d != "hdpi":
                  mask = Image.new("L", (s * SS, s * SS), 0)
                  ImageDraw.Draw(mask).ellipse([0, 0, s * SS - 1, s * SS - 1], fill=255)
                  rd = Image.new("RGBA", (s * SS, s * SS), (0, 0, 0, 0)); rd.paste(bg, (0, 0), mask)
                  rd = rd.resize((s, s), Image.LANCZOS)
                  rd.alpha_composite(heart_layer(s, 0.58))
                  save(rd, f"mipmap-{d}/ic_launcher_round.png")
          print("icons ok")
          PINK_ICONS_EOF
          cat > pink/overlay/java/com/v2ray/ang/ui/compose/PinkEffects.kt <<'PINK_KT_EOF'
          package com.v2ray.ang.ui.compose

          import androidx.compose.animation.core.LinearEasing
          import androidx.compose.animation.core.animateFloat
          import androidx.compose.animation.core.infiniteRepeatable
          import androidx.compose.animation.core.rememberInfiniteTransition
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import kotlin.math.PI
          import kotlin.math.sin

          /**
           * Soft pastel bubbles that float up the screen. Purely decorative: a Canvas does not
           * consume touches, so everything underneath stays fully clickable.
           */
          @Composable
          fun PinkBubbles(modifier: Modifier = Modifier) {
              val transition = rememberInfiniteTransition(label = "pinkBubbles")
              val t by transition.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(durationMillis = 24000, easing = LinearEasing)),
                  label = "pinkBubblesT"
              )
              Canvas(modifier.fillMaxSize()) {
                  val w = size.width
                  val h = size.height
                  val a = t * 2f * PI.toFloat()
                  repeat(14) { i ->
                      val k = 1 + i % 3
                      val seed = (i * 0.61803f) % 1f
                      val p = (t * k + seed) % 1f
                      val x = w * ((seed * 7.3f) % 1f) + sin(a * k + i) * 16f
                      val y = h * (1f - p)
                      val r = (4 + (i % 4) * 3) * density
                      val alpha = sin(p * PI.toFloat()) * 0.30f
                      val base = if (i % 2 == 0) Color(0xFFFF8FBC) else Color(0xFFD9B8FF)
                      drawCircle(base.copy(alpha = alpha), r, Offset(x, y))
                      drawCircle(Color.White.copy(alpha = alpha * 1.2f), r * 0.28f, Offset(x - r * 0.3f, y - r * 0.3f))
                  }
              }
          }
          PINK_KT_EOF

      - name: Make pink icons
        run: |
          pip install pillow
          python3 pink/genicons.py pink/overlay/res

      - name: Apply pink theme
        run: python3 pink/apply.py src

      - name: Setup Go (for hevtun)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
          grep -q 'compileSdk = 37' src/V2rayNG/app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 37\n    ndkVersion = "30.0.16248370"/' src/V2rayNG/app/build.gradle.kts
          grep -q 'ndkVersion' src/V2rayNG/app/build.gradle.kts

      - name: Build libhevtun (tunnel engine)
        working-directory: src
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: |
          cp -r src/libs src/V2rayNG/app/libs 2>/dev/null || cp -r src/libs src/V2rayNG/app/
          ls -R src/V2rayNG/app/libs | head -n 50

      - name: Find AndroidLibXrayLite version
        run: |
          cd src/AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "Xray lib tag: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV

      - name: Download libv2ray (Xray engine)
        uses: robinraju/release-downloader@v1.12
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: src/V2rayNG/app/libs/
          tarBall: false
          zipBall: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Create signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/pinky.jks" -alias pinky -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass pinkypass123 -keypass pinkypass123 -dname "CN=Pinky VPN"

      - name: Build APK
        working-directory: src/V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew licenseFdroidReleaseReport || true
          ./gradlew assemblePlaystoreRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/pinky.jks" \
            -Pandroid.injected.signing.store.password=pinkypass123 \
            -Pandroid.injected.signing.key.alias=pinky \
            -Pandroid.injected.signing.key.password=pinkypass123
          ls -lh app/build/outputs/apk/playstore/release/

      - name: Upload APK for most phones (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: PinkyVPN-arm64-v8a
          path: src/V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk
          if-no-files-found: warn

      - name: Upload universal APK (works on every phone)
        uses: actions/upload-artifact@v4
        with:
          name: PinkyVPN-universal
          path: src/V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk
          if-no-files-found: warn
